<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>css project1</title>
</head>

<body>
    <div class="bg-black min-h-screen flex justify-center items-center">
        <div class="Container flex gap-6 flex-wrap w-[600px] justify-center items-center">


            <button class="bg-pink-500   px-7 py-1 hover:bg-pink-400 rounded-sm cursor-pointer text-white">Sign
                Up</button>



            <button
                class="bg-black border-2 border-pink-500 px-7 py-1 text-pink-500 hover:bg-pink-400 hover:text-white hover:border-none">Link
                <i class="fa-solid fa-link ml-2"></i></button>


            <button class="bg-yellow-500  px-7 py-1 hover:bg-yellow-400 rounded-sm cursor-pointer text-white">Login
                <i class="fa-solid fa-link ml-2"></i></button>


            <button
                class="bg-black border-2 border-yellow-500 px-7 py-1 text-yellow-500 hover:bg-yellow-400 hover:text-black hover:border-none rounded-sm">Search
                <i class="fa-solid fa-magnifying-glass ml-2"></i></button>

            <button
                class=" bg-green-500 rounded-md px-4 py-1 text-black cursor-pointer hover:bg-green-400 hover:border-none"><i
                    class="fa-solid fa-circle text-green-800 mr-2"></i>Link-05</button>


            <button
                class="bg-black border-2 border-green-500 rounded-md px-4 py-1 text-green-800 cursor-pointer hover:bg-green-400 hover:border-none"><i
                    class="fa-solid fa-circle text-green-800 mr-2"></i>Link-06</button>


            <button
                class="bg-gradient-to-r from-yellow-300 via-pink-600 to-blue-600  hover:from-blue-600 hover:via-pink-600 hover:to-yellow-300 px-6 py-2">Play
                Now <i class="fa-brands fa-google-play" style="color: #f7f7f7;"></i></button>


            <button class="bg-blue-500 px-6 py-2 text-white hover:bg-blue-400">More Article <i
                    class="fa-solid fa-right-long "></i></button>

            <button class="bg-white text-black border-2 border-black rounded-full px-6 py-1 hover:bg-gray-200"><i
                    class="fa-solid fa-circle" style="color: #000000;"></i>Light</button>


            <button
                class="bg-black text-white border-2 border-white rounded-full px-6 py-1 hover:bg-gray-500 hover:    border-none"><i
                    class="fa-solid fa-circle" style="color: #fcfcfc;"></i>Dark</button>

            <div class="border-1 border-white ">
                <span class=" px-6 py-1 text-yellow-500"><i class="fa-solid fa-star fa-beat-fade"
                        style="color: #FFD43B;"></i>
                    Starred</span>
                <span class="border-l-2 border-white"><i class="fa-solid fa-angle-down"
                        style="color: #f5f5f5;"></i></span>
            </div>


            <div class="relative">
                <button class="px-1 py-1"><i class="fa-solid fa-cart-shopping fa-shake text-3xl"
                        style="color: #fbfcfe;"></i></button>
                <span class="bg-red-600 text-white text-xs px-1 rounded-full absolute top-[-5px] right-1">0</span>
            </div>

            <div class="Container flex gap-6 flex-wrap w-[600px]">

                <!-- <div class="w-70 h-100 border border-pink-500 relative">Parent

                    <div class="w-15 border border-blue-500 absolute bottom-0 right-0">Child</div>
                </div> -->



            </div>



        </div>


    </div>



</body>

</html>
